# Development helper. Packages the prebuilt Mathlib cache files as a
# short-lived build artifact so that the proofs can be checked outside
# GitHub Actions. It does not affect the main build.
name: export-cache

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-cache.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
      - name: Package cache files
        run: |
          ls ~/.cache/mathlib | head -5
          ls ~/.cache/mathlib | wc -l
          du -sh ~/.cache/mathlib
          tar -cf mathlib-cache.tar -C ~/.cache/mathlib .
          ls -la mathlib-cache.tar
      - uses: actions/upload-artifact@v4
        with:
          name: mathlib-cache
          path: mathlib-cache.tar
          retention-days: 2
          compression-level: 0
